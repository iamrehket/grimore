name: version
on:
  pull_request:
permissions:
  contents: read
jobs:
  version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # required: the check resolves the merge-base
      - name: require a version bump matching the change type
        env:
          # Attacker-controlled text; never interpolate into the command itself.
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/scripts/check_version_bump.py
