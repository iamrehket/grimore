name: tests
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Fixture repos commit during tests; runners have no git identity.
      # Proper per-fixture config is an open follow-up (rides with IAM-46).
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@invalid
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@invalid
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run pytest
